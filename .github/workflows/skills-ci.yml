name: skills-ci
"on":
  # Only run when skill content, the validators, the manifest, or this
  # workflow change — pure docs/other-CI PRs don't need the gate. When it
  # does run it still lints ALL skills, not just the changed ones.
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/skills-ci.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/skills-ci.yml"
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: skills-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint skills against best practices
        id: lint
        run: |
          # stdout -> JSON report; stderr -> coverage summary (how many skills scanned)
          python scripts/lint_skills.py --format json > lint-report.json 2> lint-summary.txt \
            || echo "lint_failed=true" >> "$GITHUB_OUTPUT"
          cat lint-summary.txt   # surface coverage in the job log (proves all skills ran)

      - name: Audit skill scripts for execution risks
        id: audit
        run: |
          # stdout -> JSON report; stderr -> coverage summary (how many scripts scanned)
          python scripts/audit_skill_scripts.py --format json > audit-report.json 2> audit-summary.txt \
            || echo "audit_failed=true" >> "$GITHUB_OUTPUT"
          cat audit-summary.txt   # surface coverage in the job log

      - name: Compile all skill scripts (syntax gate)
        run: python -m compileall -q plugins scripts

      - name: Run skill validator tests
        run: |
          # unittest's package-based discovery can't span the non-package scripts
          # dirs from one root, so discover per directory that holds test_*.py.
          fail=0
          for d in $(find . -name 'test_*.py' -not -path '*/node_modules/*' -printf '%h\n' | sort -u); do
            echo "::group::tests in $d"
            python -m unittest discover -s "$d" -p 'test_*.py' -t "$d" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Post / update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch (e) { return ''; } };
            const readJson = (f) => { try { return JSON.parse(read(f)); } catch (e) { return []; } };
            const table = (rows) => {
              let t = '| Path | Rule | Message |\n|---|---|---|\n';
              for (const r of rows) t += `| \`${r.path}\` | \`${r.rule}\` | ${r.message} |\n`;
              return t;
            };
            const findings = readJson('lint-report.json');
            const audit = readJson('audit-report.json');
            const coverage = read('lint-summary.txt').trim();
            const auditCoverage = read('audit-summary.txt').trim();
            const marker = '<!-- skills-ci -->';
            let body = marker + '\n## 🧭 Skills best-practices lint\n\n';
            if (coverage) body += `_${coverage}_\n\n`;
            if (findings.length === 0) {
              body += '✅ All skills pass the mechanical best-practices rules.\n';
            } else {
              body += `⚠️ ${findings.length} finding(s):\n\n` + table(findings);
            }
            body += '\n## 🔒 Skill script security audit\n\n';
            if (auditCoverage) body += `_${auditCoverage}_\n\n`;
            if (audit.length === 0) {
              body += '✅ No code-execution risks found in skill scripts.\n';
            } else {
              body += `❌ ${audit.length} finding(s):\n\n` + table(audit);
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            const args = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) await github.rest.issues.updateComment({ ...args, comment_id: existing.id });
            else await github.rest.issues.createComment({ ...args, issue_number: context.issue.number });

      - name: Fail if lint or audit found violations
        if: always() && (steps.lint.outputs.lint_failed == 'true' || steps.audit.outputs.audit_failed == 'true')
        run: |
          [ "${{ steps.lint.outputs.lint_failed }}" = "true" ] && \
            echo "::error::Skill best-practices lint found violations (see PR comment / job log)."
          [ "${{ steps.audit.outputs.audit_failed }}" = "true" ] && \
            echo "::error::Skill script security audit found execution risks (see PR comment / job log)."
          exit 1

  lint-meta:
    # Informational gate for the CI's own config + docs. Non-blocking: steps
    # report problems but never fail the job, so tooling churn (a flaky link,
    # a schema the action lags on) can't wedge skill PRs. Read the logs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install meta-lint tooling
        run: pip install --quiet yamllint==1.35.1 check-jsonschema==0.31.2

      - name: Lint workflow YAML
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 160}, document-start: disable}}' .github/workflows/ || true

      - name: Validate workflow schemas
        run: check-jsonschema --builtin-schema github-workflows .github/workflows/*.yml || true

      - name: Spot-check README links
        run: npx --yes markdown-link-check@3.13.6 -q README.md || true
