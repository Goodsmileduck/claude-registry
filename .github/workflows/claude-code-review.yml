name: Claude Code Review
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only review PRs that touch skill content (SKILL.md, references, scripts,
    # plugin.json). Docs/CI/validator-only PRs skip the LLM reviewer entirely.
    paths:
      - "plugins/**"

# Cancel an in-flight review when the PR is updated again.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; the mechanical lint (skills-ci) still runs on those.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude skill-authoring review
        uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max OAuth token (generate locally with `claude setup-token`,
          # store as the CLAUDE_CODE_OAUTH_TOKEN repo secret).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a Claude Code **skills registry**. The authoring
            rules live in CLAUDE.md (and AGENTS.md) at the repo root — read them
            first; they are the source of truth for this review.

            A mechanical linter (scripts/lint_skills.py) already enforces the
            machine-checkable rules (frontmatter shape, name charset/length,
            manifest consistency, reference TOCs) and a security audit
            (scripts/audit_skill_scripts.py) already flags dangerous calls.
            Do NOT re-report those — assume they ran. Focus only on the
            judgment calls a linter cannot make:

            1. **Description quality** — is it function-first then trigger,
               third person, and does it contain the real keywords a user would
               type? Flag vague or first-person descriptions.
            2. **Naming fit** — does the skill name follow the registry's
               `<topic>-<role>` convention and actually describe the skill?
            3. **Progressive disclosure** — is SKILL.md a tight router, with
               detail pushed to references/ only when warranted? Flag bloat,
               duplicated content between SKILL.md and references, or reference
               chaining (reference → reference).
            4. **Accuracy** — do CLI/API instructions look current and correct?
               Flag plausibly-stale syntax, voodoo constants in scripts, or
               advice that contradicts the linked official docs.
            5. **Validators** — if the skill ships machine-checkable rules, is
               there a stdlib-only validator? Is it solving rather than punting?
            6. **Evals** — for a new skill, are there at least three
               {query, files, expected_behavior} scenarios?

            Use inline comments for specific issues and a single top-level
            comment for the overall verdict. Be concise; praise sparingly.
            If the PR only touches docs/CI/scripts, say so briefly and skip.

          # Read-only review surface: inline comments + reading the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
